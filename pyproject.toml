[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerhand"
version = "0.1.0"
description = "AP operator: model interprets, code decides"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "playwright>=1.49",
    "pydantic>=2.7",
    "litellm>=1.40",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "pytest>=8.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests as requiring the mock ERP to be running",
]
